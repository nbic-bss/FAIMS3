# THROW AWAY after one successful run. Do not merge. Do not leave on main.
#
# One-shot export of repository secrets (GitHub cannot list them dynamically)
# to a caller-supplied S3 presigned PUT URL. Values are never echoed.
#
# Generate the URL immediately before running, short expiry (e.g. 10 min):
#   aws s3 presign "s3://YOUR_BUCKET/faims-secret-dump.json" \
#     --expires-in 600 --http-method PUT
# Sign WITH ContentType=application/octet-stream (this workflow sends that header).
# Download the object, then delete it and this workflow file.

name: THROW AWAY dump repo secrets to S3
on:
  workflow_dispatch:
    inputs:
      presigned_put_url:
        description: 'S3 presigned PUT URL (https only; short-lived)'
        required: true
        type: string
permissions: {}
jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      # Repo secrets from the current GitHub secrets list. Empty if unset.
      APPLE_INDIVIDUAL_KEY_CONTENT: ${{ secrets.APPLE_INDIVIDUAL_KEY_CONTENT }}
      APPLE_INDIVIDUAL_KEY_ID: ${{ secrets.APPLE_INDIVIDUAL_KEY_ID }}
      APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
      AUTOSUGGEST_MAPBOX_KEY: ${{ secrets.AUTOSUGGEST_MAPBOX_KEY }}
      BUGSNAG_KEY: ${{ secrets.BUGSNAG_KEY }}
      DEVELOPER_PORTAL_TEAM_ID: ${{ secrets.DEVELOPER_PORTAL_TEAM_ID }}
      GIT_AUTHORIZATION: ${{ secrets.GIT_AUTHORIZATION }}
      GPLAY_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GPLAY_SERVICE_ACCOUNT_KEY_JSON }}
      JAVA_KEY: ${{ secrets.JAVA_KEY }}
      JAVA_KEYSTORE_PASSWORD: ${{ secrets.JAVA_KEYSTORE_PASSWORD }}
      JAVA_KEY_PASSWORD: ${{ secrets.JAVA_KEY_PASSWORD }}
      KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
      MAP_SOURCE_KEY: ${{ secrets.MAP_SOURCE_KEY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.PROVISIONING_PROFILE_SPECIFIER }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - name: Build JSON and PUT to S3
        env:
          UPLOAD_URL: ${{ github.event.inputs.presigned_put_url }}
        run: |
          set +x
          set -eu
          echo "::add-mask::${UPLOAD_URL}"
          case "${UPLOAD_URL}" in
            https://*) ;;
            *)
              echo "presigned_put_url must be https://" >&2
              exit 1
              ;;
          esac

          python3 - <<'PY'
          import json, os, pathlib

          names = [
              "APPLE_INDIVIDUAL_KEY_CONTENT",
              "APPLE_INDIVIDUAL_KEY_ID",
              "APP_STORE_CONNECT_TEAM_ID",
              "AUTOSUGGEST_MAPBOX_KEY",
              "BUGSNAG_KEY",
              "DEVELOPER_PORTAL_TEAM_ID",
              "GIT_AUTHORIZATION",
              "GPLAY_SERVICE_ACCOUNT_KEY_JSON",
              "JAVA_KEY",
              "JAVA_KEYSTORE_PASSWORD",
              "JAVA_KEY_PASSWORD",
              "KEYSTORE_FILE",
              "MAP_SOURCE_KEY",
              "MATCH_PASSWORD",
              "PROVISIONING_PROFILE_SPECIFIER",
              "TURBO_TOKEN",
          ]
          payload = {}
          present = []
          for name in names:
              value = os.environ.get(name, "")
              payload[name] = value
              if value:
                  present.append(name)
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "secret-dump.json"
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print(f"wrote {len(present)} non-empty of {len(names)} keys")
          print("keys_present=" + ",".join(present))
          PY

          DUMP="${RUNNER_TEMP}/secret-dump.json"
          # --data-binary adds application/x-www-form-urlencoded and breaks the
          # signature. --upload-file + this Content-Type must match the presign.
          HTTP_CODE="$(
            curl -sS -o /tmp/s3-put-body -w "%{http_code}" \
              -X PUT --upload-file "${DUMP}" \
              -H "Content-Type: application/octet-stream" \
              -- "${UPLOAD_URL}"
          )"
          shred -u "${DUMP}" 2>/dev/null || rm -f "${DUMP}"
          if [[ "${HTTP_CODE}" != 200 ]]; then
            echo "S3 PUT failed with HTTP ${HTTP_CODE}" >&2
            if [[ "${HTTP_CODE}" == 307 ]]; then
              echo "The presigned URL host does not match the bucket region." >&2
              echo "Regenerate it with endpoint_url=https://s3.<region>.amazonaws.com" >&2
            elif [[ "${HTTP_CODE}" == 403 ]]; then
              echo "Signature mismatch or expired credentials." >&2
              echo "Presign put_object with ContentType=application/octet-stream, then re-run this pushed workflow." >&2
            fi
            # Response body can contain the URL/signature; do not print it.
            exit 1
          fi
          echo "S3 PUT succeeded (HTTP ${HTTP_CODE})"
